# Configuration for steamos-led-serial.
# Installed to /etc/steamos-led-serial.conf - edit, then:
#   sudo systemctl restart steamos-led-serial

# Character device provided by the leds-valve-shim kernel module.
DEVICE=/dev/valve-leds-shim

# Serial port of the ESP. "auto" picks the first known USB-serial adapter.
# For a stable name use the udev symlink: /dev/steamos-led-esp
SERIAL_PORT=auto

# Preferred baud rate; must match SERIAL_BAUD in the firmware build flags.
# All shipped firmware environments use 230400 - fast enough for ~120 LEDs at
# 60 fps, and reliable on USB-serial adapters that get flaky above that.
# Raise it on both sides only for longer strips at full frame rate.
BAUD=230400

# If the ESP does not answer the handshake at BAUD, try the other rates the
# shipped firmware uses. The service logs which one worked - put that value in
# BAUD above to skip the search on the next start. Set to 0 to disable.
BAUD_AUTODETECT=1

# Number of LEDs on the physical strip (the Steam Machine bar has 17).
LED_COUNT=17

# How the 17 logical LEDs map onto a strip with a different length:
#   stretch - interpolate across the whole strip (default)
#   repeat  - tile the 17 LED pattern
#   crop    - 1:1, leftover LEDs stay dark
MAPPING=stretch

# Flip the direction if the bar runs the wrong way round.
REVERSE=0

# Brightness limits, 0-255. MAX_BRIGHTNESS caps the output (useful when the
# strip is powered from the ESP's USB rail). MIN_BRIGHTNESS raises the floor -
# set it to e.g. 40 if the strip stays dark because Steam reports brightness 0.
MAX_BRIGHTNESS=255
MIN_BRIGHTNESS=0

# Gamma correction. 1.0 passes Steam's values through unchanged; 2.2 looks
# smoother on WS2812 strips, especially when dimmed.
GAMMA=1.0

# Animation speed multiplier for rainbow/breath/patrol/demo.
SPEED=1.0

# Frame rate while an effect is animating, and the idle heartbeat rate for
# static scenes (the firmware blanks the strip if the link goes quiet).
FPS=60
IDLE_FPS=4

# Seconds to wait before retrying the serial port after it disappears.
RECONNECT_DELAY=2.0

# debug | info | warning | error
LOG_LEVEL=info
