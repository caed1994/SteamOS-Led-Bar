# Configuration for steamos-led-serial.
# Installed to /etc/steamos-led-serial.conf - edit, then:
#   sudo systemctl restart steamos-led-serial

# Character device provided by the leds-valve-shim kernel module.
DEVICE=/dev/valve-leds-shim

# Serial port of the ESP. "auto" picks the first known USB-serial adapter.
# For a stable name use the udev symlink: /dev/steamos-led-esp
SERIAL_PORT=auto

# Preferred baud rate; must match SERIAL_BAUD in the firmware build flags.
# All shipped firmware environments use 230400 - fast enough for ~120 LEDs at
# 60 fps, and reliable on USB-serial adapters that get flaky above that.
# Raise it on both sides only for longer strips at full frame rate.
BAUD=230400

# If the ESP does not answer the handshake at BAUD, try the other rates the
# shipped firmware uses. The service logs which one worked - put that value in
# BAUD above to skip the search on the next start. Set to 0 to disable.
BAUD_AUTODETECT=1

# Number of LEDs on the physical strip (the Steam Machine bar has 17).
LED_COUNT=17

# How the 17 logical LEDs map onto a strip with a different length:
#   stretch - interpolate across the whole strip (default)
#   repeat  - tile the 17 LED pattern
#   crop    - 1:1, leftover LEDs stay dark
MAPPING=stretch

# Flip the direction if the bar runs the wrong way round - most visible on the
# download progress bar, which should grow from the same end Steam starts at.
REVERSE=0

# Brightness limits, 0-255. MAX_BRIGHTNESS caps the output (useful when the
# strip is powered from the ESP's USB rail) and applies to notification
# flashes too - those light the whole bar at once, which is the worst case
# for a strip on that rail. MIN_BRIGHTNESS raises the floor under what Steam
# asks for - set it to e.g. 40 if the strip stays dark because Steam reports
# brightness 0. It does not apply to flashes, which have to reach zero at
# both ends or two in a row would run together.
MAX_BRIGHTNESS=255
MIN_BRIGHTNESS=0

# Gamma correction. 1.0 passes Steam's values through unchanged; 2.2 looks
# smoother on WS2812 strips, especially when dimmed.
GAMMA=1.0

# Animation speed multiplier for rainbow/breath/patrol/demo.
# Lower is slower: 0.5 halves the speed, 2.0 doubles it.
SPEED=1.0

# Number of dots the patrol effect chases across the bar. One is the classic
# look; the snapshot's patrol_num field is deliberately not used for this,
# see the comment in render.py.
PATROL_DOTS=1

# Notifications briefly take over the whole bar and then hand it straight back
# to whatever Steam is showing. Fire one with:
#     steamos-led-serial --notify achievement
# To see what a shape looks like before setting it, name it for that one
# flash - nothing is saved:
#     steamos-led-serial --notify comet:#1a9fff
# Anything that can write a line into the FIFO below can trigger a flash, so a
# script, a game launcher hook or a future achievement watcher all work.
NOTIFY=1
NOTIFY_DURATION=3.5
NOTIFY_FIFO=/run/steamos-led-serial/notify

# Flashes queue instead of interrupting each other, so an achievement and a
# message arriving together are both shown, one after the other.
# A repeat is not queued, though: while the bar is showing something, and for
# this many seconds afterwards, the same trigger is ignored. Otherwise someone
# typing at you once a second would hold the bar lit indefinitely, when the
# first flash already said everything the others do. 0 turns it off.
NOTIFY_REPEAT_GAP=10

# Shape of the flash:
#   bloom        - grows out of the middle, breathes once, retracts (default)
#   pulse        - the whole bar swells three times
#   double_flash - two short blinks, a pause, and again; timed in seconds, so
#                  a longer flash means more pairs rather than slower ones
#   comet        - a head with a fading tail, once across the bar. The only
#                  shape with a direction, so REVERSE applies to it
#   alternate    - the two halves of the bar flash in turn
#   sparkle      - grains of light flicker on and die out all over the bar,
#                  each LED on its own clock so nothing marches
# This is the shape everything uses that has not been given one of its own
# below - --notify warning and --notify '#00ff88' included.
NOTIFY_STYLE=bloom

# A shape for one kind of notification on its own, so an achievement need not
# look like a friend logging in. Any of the shapes above, or "default" to
# follow NOTIFY_STYLE - which is what all three do until you change them.
# The duration is shared: one flash lasts NOTIFY_DURATION whatever its shape.
# A warning is not in this list, and neither is its colour: it is the one
# notification you must not have to recognise, so it is always red and always
# "alternate", on every machine.
ACHIEVEMENT_STYLE=default
MESSAGE_STYLE=default
FRIEND_STYLE=default
PHONE_STYLE=default

# What each named notification flashes. Any colour as #rrggbb or r,g,b; the
# control panel offers a few named ones. A colour asked for directly, as in
# --notify '#00ff88', is flashed exactly as given.
ACHIEVEMENT_COLOR=#ffff00
MESSAGE_COLOR=#8000ff
FRIEND_COLOR=#00ff00
PHONE_COLOR=#00ffff

# What the watcher next to Steam looks out for. All three only work while a
# game is running: Steamworks has to be initialised as a specific app, and
# holding a session open outside one stops Steam from finishing "Stopping" a
# game. The two friend ones additionally need a libsteam_api.so new enough to
# deliver callbacks - see steamos-led-serial --probe-messages. Chat needs one
# thing more, which the Steam client may decline; a friend coming online does
# not, so it still works where messages do not. With all three off the watcher
# attaches to nothing at all.
# These are about automatic detection; --notify flashes any colour whatever
# they say. NOTIFY above is the master switch for the flashing itself.
NOTIFY_ACHIEVEMENTS=1
NOTIFY_MESSAGES=1
NOTIFY_FRIEND_ONLINE=1

# Flash on the notifications your phone sends to the desktop. KDE Connect is
# what carries them over - pair the phone in its settings and switch its
# notification sync on - and this reads them from the session bus. Nothing
# here talks to WhatsApp or to any other app: it reads the *notification*, so
# an app you have silenced on the phone stays silent here too.
#
# Off by default. It is the one notification that needs something set up
# outside this machine, and a bar that flashed at a stranger's phone traffic
# the moment they installed this would be a surprise.
NOTIFY_PHONE=0

# Where to read them from:
#   auto        - KDE Connect if it is on the session bus, the desktop's own
#                 notifications otherwise (default)
#   kdeconnect  - only the phone, which is usually what is wanted: a chat app
#                 on the desktop is not a phone notification
#   desktop     - every notification on this desktop, the phone's among them.
#                 The net for a machine where KDE Connect answers nothing
PHONE_SOURCE=auto

# A look of its own per app: App:colour, or App:colour:shape. Separated by
# commas, which is why a colour goes in as #rrggbb here rather than as r,g,b.
# The app is matched loosely and without case, so "whatsapp" finds both
# "WhatsApp" and "com.whatsapp" - the two names the two sources use.
# Anything not named here flashes PHONE_COLOR in PHONE_STYLE.
# To find out what the apps are called on your machine, watch it work:
#     steamos-led-serial --watch-phone --print
# PHONE_APPS=WhatsApp:#25d366:double_flash, Signal:#3a76f0
PHONE_APPS=

# Only flash for the apps named above, ignoring everything else the phone
# sends. Off means everything flashes and the list only changes how.
PHONE_APPS_ONLY=0

# Flash red when the machine is overheating. Unlike the three above this needs
# no game and no Steam: the service watches every sensor that publishes a
# critical point of its own, and warns when one has stayed within a few
# degrees of it for a minute. Nothing to configure - the thresholds come from
# the parts, and steamos-led-serial --temperature shows which sensors are
# watched on this machine and at what temperature.
# Separate from the temperature gauge below in every way: either works with
# the other switched off.
NOTIFY_WARNING=1

# Breathe white while the machine is suspended, instead of leaving the strip
# dark. The ESP draws this one itself - during a suspend the service is frozen
# and cannot render anything - so it needs the firmware shipped with this
# version; an older one simply leaves the strip dark, as before.
# A systemd sleep hook tells the service just before the machine goes down.
# What it looks like is fixed: "the machine is off but alive" should not be
# something you have to recognise.
STANDBY_PULSE=1

# What the "Rainbow" entry in Steam's LED menu actually shows. That menu
# cannot be extended - its entries are built into the client - so anything of
# ours has to take one over, and the rainbow is the one most people are happy
# to give up. Set this, then pick "Rainbow" in Steam to see it; every other
# effect keeps working exactly as before.
#
#   rainbow      Steam's own rainbow, unchanged (the default)
#   temperature  how hot the machine is, as one colour across the whole bar:
#                green while cool, red once hot, mixed in between
#   load         how busy the chips are: two bars growing out of the middle,
#                CPU to the left in amber and GPU to the right in blue.
#                See: steamos-led-serial --load
#   fire         flame, drifting along the strip
#   aurora       slow curtains of green and violet - a calm rainbow
RAINBOW_SHOWS=rainbow

# Where the temperature scale sits, when RAINBOW_SHOWS=temperature. Green up
# to TEMPERATURE_MIN, red from TEMPERATURE_MAX up, and yellow halfway between
# the two - so the defaults below mean green to 40 C, yellow at 60 C, red from
# 80 C. Move them together for a sensor that runs hot, or apart to see smaller
# changes; they must stay at least 5 degrees apart, or there is no room left
# to fade.
TEMPERATURE_MIN=40.0
TEMPERATURE_MAX=80.0

# Which sensor the temperature gauge reads. "auto" prefers the CPU/GPU package
# sensor over the dozen other things a machine measures (SSD, wifi card,
# battery). To choose by hand, put in a path from: steamos-led-serial --temperature
# The control panel offers the same list as a drop-down.
TEMPERATURE_SENSOR=auto

# Which libsteam_api.so the achievement watcher borrows. "auto" searches
# the installed games and picks one matching this Python's architecture -
# Proton ships a 32-bit and a 64-bit copy side by side. Set a path to
# override. See: steamos-led-serial --steam-check
STEAM_LIBRARY=auto

# How the watcher reaches ISteamUserStats. "auto" tries the candidates in
# child processes and keeps the one that survives - the flat wrappers are
# built against a single interface version and the wrong one segfaults,
# so this cannot be decided by reading alone. Pin the value that
# --steam-check reports to skip the search at startup.
STEAM_ROUTE=auto

# Frame rate while an effect is animating, and the idle heartbeat rate for
# static scenes (the firmware blanks the strip if the link goes quiet).
FPS=60
IDLE_FPS=4

# Seconds to wait before retrying the serial port after it disappears.
RECONNECT_DELAY=2.0

# debug | info | warning | error
LOG_LEVEL=info
