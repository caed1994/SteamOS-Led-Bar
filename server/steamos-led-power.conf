# CPU power settings for the SteamOS LED bar toolbox.
#
# Written by the control panel's EPP & Governor page, and applied at boot by
# steamos-led-power.service. Nothing here is set by default: an installation
# nobody has configured leaves the CPU exactly as SteamOS set it.
#
# To see what your machine offers:
#     steamos-led-power --report
#
# The governor decides the clock. With amd-pstate in active mode - what a
# Steam Machine ships with - there are two:
#   powersave    - the firmware picks the clock within its range (the usual one)
#   performance  - hold the top of the range
# In passive or guided mode the classic governors are back instead
# (ondemand, schedutil, conservative ...).
CPU_GOVERNOR=

# The energy performance preference: a hint about where in its range the
# firmware should sit. Usually one of:
#   default  performance  balance_performance  balance_power  power
#
# Written only alongside a governor above. With CPU_GOVERNOR empty this is
# ignored entirely - the CPU is not being managed here, so neither half of it
# is asserted - and it is ignored under the performance governor too, which
# pins the preference to the top and makes the kernel refuse the file.
# That is why there is no "leave it alone" value for this one.
CPU_EPP=default
