# A drop-in for the CEC toolkit's own boot-wake service. Not our unit: this
# only changes one line of it, which is what a drop-in is for - the vendored
# tree stays a tree we can diff against upstream.
#
# Measured on a machine where installing the toolkit doubled the boot:
#
#   26.050s steamos-cec-boot-wake.service
#      64ms steamos-utility-center-cec.service
#   default.target @26.231s
#
# The service is not slow by accident. It settles for eight seconds and then
# makes four attempts five seconds apart, because a television that has just
# been switched on is not ready at once. That is the right thing to do - and
# the wrong thing to make a desktop session wait for. As Type=oneshot it is
# "still starting" the whole time, so default.target is not reached until the
# last attempt is over, and the session sits there while nothing is wrong.
#
# Type=simple lets systemd count it as started the moment it is running. It
# still sends exactly what it sent before, in the same order, over the same
# 26 seconds - it just does it beside the session instead of in front of it.
# Nothing is ordered after it, so nothing loses anything by that; our own
# unit is ordered *before* it and still is.
[Service]
Type=simple
