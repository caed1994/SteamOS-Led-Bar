; Firmware for the USB-serial LED client.
;
;   pio run -e nodemcuv2 -t upload        ; ESP8266 (NodeMCU / D1 mini)
;   pio run -e esp32dev -t upload         ; ESP32
;   pio run -e esp8266_gpio14 -t upload   ; ESP8266 keeping the D5 wiring
;
; Adjust LED_COUNT and COLOR_ORDER to your strip. LED_COUNT here is only the
; boot default - the host tells the firmware the real length with every frame.
;
; Every environment runs the USB link at 230400 baud. Higher rates are not
; reliable on all USB-serial adapters (CH340 clones in particular), and 230400
; is not a bottleneck for typical strips: a frame is 10 + 3*LEDs bytes, so it
; carries ~120 LEDs at 60 fps. For longer strips at full frame rate, raise
; SERIAL_BAUD below and set the same BAUD in /etc/steamos-led-serial.conf -
; 460800 doubles the headroom where the adapter can keep up.
;
; SERIAL_BAUD is set per environment, never in [env]: a shared value would have
; to be undefined again in the environments that differ, and PlatformIO does
; not pass "-U NAME" through to the compiler intact.

[env]
framework = arduino
lib_deps = makuna/NeoPixelBus @ ^2.7.3
build_flags =
    -D LED_COUNT=17
    -D MAX_LEDS=300
    -D LINK_TIMEOUT_MS=5000
    ; Cap output when the strip is powered from the ESP's 5V/USB rail.
    -D MAX_BRIGHTNESS=255
    ; Length of one breath of the waiting animation, in milliseconds. It runs
    ; from power-up until the service says something; larger is calmer.
    -D WAIT_BREATH_MS=3000
    ; Colour order of your strip: WS2812B is GRB, WS2811 is often RGB.
    ; -D COLOR_ORDER_RGB
    ; -D COLOR_ORDER_BRG

; --- ESP8266, recommended wiring: data on GPIO2 (D4) ------------------------
; UART1 clocks the strip in hardware, so serial reception never stalls.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
monitor_speed = 230400
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=230400
    -D LED_PIN=2
    -D DEVICE_NAME=\"esp8266-led-client\"

[env:d1_mini]
platform = espressif8266
board = d1_mini
board_build.f_cpu = 160000000L
monitor_speed = 230400
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=230400
    -D LED_PIN=2
    -D DEVICE_NAME=\"esp8266-led-client\"

; --- ESP8266 keeping an existing GPIO14 (D5) wiring -------------------------
; Bit-banging disables interrupts while the strip is refreshed, so the baud
; rate is lowered to keep the 128 byte UART FIFO from overflowing. Set
; BAUD=230400 in /etc/steamos-led-serial.conf to match.
; Flags are spelled out instead of inherited because MAX_LEDS differs.
[env:esp8266_gpio14]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 160000000L
monitor_speed = 230400
build_flags =
    -D LED_COUNT=17
    -D MAX_LEDS=120
    -D LINK_TIMEOUT_MS=5000
    -D MAX_BRIGHTNESS=255
    -D WAIT_BREATH_MS=3000
    -D SERIAL_BAUD=230400
    -D LED_PIN=14
    -D DEVICE_NAME=\"esp8266-led-client\"

; --- ESP32 family -----------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_speed = 230400
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=230400
    -D LED_PIN=16
    -D DEVICE_NAME=\"esp32-led-client\"

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
monitor_speed = 230400
build_flags =
    ${env.build_flags}
    -D SERIAL_BAUD=230400
    -D LED_PIN=16
    -D DEVICE_NAME=\"esp32s3-led-client\"
    -D ARDUINO_USB_CDC_ON_BOOT=1
